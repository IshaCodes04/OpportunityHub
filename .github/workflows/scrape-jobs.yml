name: 🚀 Scrape & Update Jobs

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  # Manual trigger
  workflow_dispatch:
  # Trigger on push to main
  push:
    branches:
      - main

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run job scraper
        run: |
          python main.py

      - name: 📝 Commit changes
        run: |
          git config --local user.email "ishu010.com@gmail.com"
          git config --local user.name "IshaCodes04"
          git add april_2026_opportunities.csv README.md
          git commit -m "🔄 Update: April 2026 job opportunities (Auto)" || echo "No changes to commit"

      - name: 🚀 Push changes to GitHub
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: false

      - name: ✅ Scrape completed successfully
        run: echo "🎉 Jobs updated and pushed to GitHub!"
